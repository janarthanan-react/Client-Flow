version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: clientflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clientflow_user
      POSTGRES_PASSWORD: clientflow_secure_password
      POSTGRES_DB: clientflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientflow_user -d clientflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clientflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: clientflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://clientflow_user:clientflow_secure_password@postgres:5432/clientflow_db?schema=public
      JWT_ACCESS_SECRET: cf_jwt_access_super_secret_production_2025
      JWT_REFRESH_SECRET: cf_jwt_refresh_super_secret_production_2025
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: sk_test_mock_stripe_key_clientflow
      STRIPE_WEBHOOK_SECRET: whsec_mock_stripe_webhook_key
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: clientflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
